name: Docker image

# Every time you push a tag like v0.6.0 this:
#   1. publishes ghcr.io/<owner>/tvhub (linux/amd64 + linux/arm64), and
#   2. creates the GitHub Release for that tag. HACS only offers Releases, not bare tags,
#      so without this step Home Assistant never sees the new integration version.
# Every push to the dev branch (when the app changes) publishes ghcr.io/<owner>/tvhub:dev to test it, e.g. with the
# "TVHub (dev)" add-on. It never touches :latest or a version tag.
# You can also run the image build by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: [dev]
    paths: ["app/**", "Dockerfile", "requirements.txt", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release (what HACS reads)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # Notes = the section of CHANGELOG.md for this version (fails the release if it is missing or empty).
          VER="${TAG#v}"
          awk -v v="$VER" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ] || ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VER. Add '## [$VER] - date' and re-run."
            exit 1
          fi
          gh release create "$TAG" --title "TVHub $VER" --notes-file notes.md --verify-tag --latest
